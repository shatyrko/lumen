[package]
name = "lumen"
version = "0.1.0"
edition = "2021"
description = "Tray control for Xiaomi/Yeelight lights over the local network (miIO), no cloud"
license = "MIT"

[lib]
name = "lumen"
path = "src/lib.rs"

[[bin]]
name = "lumen"
path = "src/main.rs"

[dependencies]
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
clap = { version = "4", features = ["derive"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
glib = "0.22"
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk4-layer-shell = "0.8"
log = "0.4"
env_logger = "0.11"
directories = "6"

[profile.release]
lto = "thin"
opt-level = 2
strip = true
